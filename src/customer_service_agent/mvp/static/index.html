<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能客服 Agent MVP</title>
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 0 16px; font: 16px system-ui; color: #172033; background: #f7f8fc; }
    main { display: grid; gap: 16px; } section, form { padding: 16px; border-radius: 12px; background: white; box-shadow: 0 1px 4px #dfe3ee; }
    #messages { min-height: 180px; white-space: pre-wrap; } .user { color: #175cd3; } .assistant { color: #027a48; }
    input, select, button { padding: 9px; font: inherit; } #message { width: min(560px, 100%); } button { cursor: pointer; }
    ul { margin: 8px 0; padding-left: 22px; } #approval { display: none; border-left: 4px solid #f79009; }
    .hint { color: #667085; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <header><h1>智能客服 Agent MVP</h1><p class="hint">真实 DeepSeek + 本地 PostgreSQL / Milvus / Neo4j / Mem0</p></header>
    <section id="messages" aria-live="polite"></section>
    <form id="message-form">
      <label>本地演示身份 <select id="customer"><option value="demo-customer-a">客户 A</option><option value="demo-customer-b">客户 B</option></select></label>
      <input id="message" required placeholder="例如：商品保修多久？" autocomplete="off">
      <button>发送</button>
    </form>
    <section><strong>工具调用</strong><ul id="tool-events"></ul></section>
    <section><strong>引用来源</strong><ul id="citations"></ul></section>
    <section id="approval"><strong>订单操作等待确认</strong><p id="approval-text"></p><button id="approve">确认执行</button> <button id="reject">拒绝</button></section>
  </main>
  <script>
    const threadId = 'demo-' + crypto.randomUUID(); let pending = null;
    const $ = id => document.getElementById(id);
    const add = (kind, text) => { const p = document.createElement('p'); p.className = kind; p.textContent = text; $('messages').append(p); };
    const eventLine = text => { const li = document.createElement('li'); li.textContent = text; $('tool-events').append(li); };
    async function consume(url, body) {
      const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Demo-Customer': $('customer').value }, body: JSON.stringify(body) });
      if (!response.ok) { add('assistant', '请求失败：' + response.status); return; }
      const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer = '';
      while (true) { const { value, done } = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const frames = buffer.split('\n\n'); buffer = frames.pop(); for (const frame of frames) handle(frame); if (done) break; }
    }
    function handle(frame) { const type = (frame.match(/^event: (.+)$/m) || [])[1]; const data = (frame.match(/^data: (.+)$/m) || [])[1]; if (!type || !data) return; const event = JSON.parse(data), payload = event.payload;
      if (type === 'message.completed') add('assistant', payload.message);
      if (type === 'tool.started') eventLine('开始：' + payload.tool_name);
      if (type === 'tool.completed') eventLine('完成：' + payload.tool_name);
      if (type === 'citation') { const li = document.createElement('li'); li.textContent = payload.title + '（' + payload.locator + '）'; $('citations').append(li); }
      if (type === 'approval.required') { pending = payload.interrupt_id; $('approval-text').textContent = '操作：' + payload.tool_name; $('approval').style.display = 'block'; }
    }
    $('message-form').addEventListener('submit', async event => { event.preventDefault(); const message = $('message').value.trim(); if (!message) return; add('user', message); $('message').value = ''; await consume('/v1/threads/' + threadId + '/messages:stream', { message }); });
    async function decide(decision) { if (!pending) return; const id = pending; pending = null; $('approval').style.display = 'none'; await consume('/v1/threads/' + threadId + '/decisions', { interrupt_id: id, decision, reason: decision === 'reject' ? '用户拒绝本次操作' : null }); }
    $('approve').onclick = () => decide('approve'); $('reject').onclick = () => decide('reject');
  </script>
</body>
</html>
